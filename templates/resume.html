<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume - Sourav Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background: #0a0a0a;
    color: white;
}

/* ===== NAVBAR (UNCHANGED) ===== */
header {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 1.5rem 5%;
    background: rgba(10, 10, 10, 0.95);
    backdrop-filter: blur(10px);
    z-index: 100;
    border-bottom: 1px solid #1a1a1a;
}

nav {
    max-width: 1200px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 1.4rem;
    font-weight: 800;
}

.logo span {
    color: #ff6b35;
}

nav ul {
    display: flex;
    gap: 2.5rem;
    list-style: none;
}

nav a {
    color: #999;
    text-decoration: none;
}

nav a:hover {
    color: #ff6b35;
}

/* ===== PDF VIEW ===== */
.pdf-container {
    margin-top: 6rem;
    height: calc(100vh - 6rem);
    position: relative;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* ===== FLOATING CONTROLS ===== */
.controls {
    position: fixed;
    bottom: 25px;
    right: 25px;
    display: flex;
    gap: 12px;
    z-index: 200;
}

/* button style */
.btn {
    padding: 10px 16px;
    border-radius: 30px;
    text-decoration: none;
    font-size: 0.85rem;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    transition: 0.3s;
}

/* home */
.home-btn {
    background: rgba(255,255,255,0.05);
    color: #ccc;
}

.home-btn:hover {
    color: #ff6b35;
    border-color: #ff6b35;
}

/* download */
.download-btn {
    background: #ff6b35;
    color: white;
}

.download-btn:hover {
    background: #ff8c42;
    box-shadow: 0 0 20px rgba(255,107,53,0.5);
    transform: translateY(-2px);
}

/* subtle glow bg */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at top, rgba(255,107,53,0.08), transparent 70%);
    z-index: -1;
}

/* responsive */
@media (max-width: 768px) {
    .controls {
        right: 15px;
        bottom: 15px;
    }

    .btn {
        padding: 8px 12px;
        font-size: 0.75rem;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<header>
    <nav>
        <div class="logo">Sourav<span>Portfolio</span></div>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/projects">Projects</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </nav>
</header>

<!-- PDF VIEW -->
<div class="pdf-container">
    <iframe src="/uploads/resume.pdf"></iframe>
</div>

<!-- FLOATING BUTTONS -->
<div class="controls">
    <a href="/" class="btn home-btn">Home</a>
    <a href="/uploads/resume.pdf" download class="btn download-btn">Download</a>
</div>

</body>
</html>
